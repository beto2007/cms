<main class="auth-shell">
	@if (user(); as currentUser) {
		<section class="welcome-panel">
			<p class="eyebrow">CMS · Sesión activa</p>
			<h1>Bienvenido de nuevo.</h1>
			<p class="user-email">{{ currentUser.email }}</p>
			<button class="button button-dark" type="button" (click)="logout()">Cerrar sesión</button>
		</section>
	} @else {
		<section class="login-panel">
			<div class="brand-mark" aria-hidden="true">N</div>
			<p class="eyebrow">Nova CMS</p>
			<h1>{{ mode() === 'login' ? 'Entra a tu espacio.' : 'Crea tu cuenta.' }}</h1>
			<p class="subtitle">Administra tu contenido desde un solo lugar.</p>
			<form (ngSubmit)="submit()" #authForm="ngForm">
				<label for="email">Correo electrónico</label>
				<input id="email" name="email" type="email" [(ngModel)]="email" required autocomplete="email">
				<label for="password">Contraseña</label>
				<input id="password" name="password" type="password" [(ngModel)]="password" required minlength="6" autocomplete="current-password">
				@if (error()) { <p class="error" role="alert">{{ error() }}</p> }
				<button class="button button-primary" type="submit" [disabled]="authForm.invalid || loading()">
					{{ loading() ? 'Procesando...' : mode() === 'login' ? 'Iniciar sesión' : 'Crear cuenta' }}
				</button>
			</form>
			<button class="switch-button" type="button" (click)="toggleMode()">
				{{ mode() === 'login' ? '¿No tienes cuenta? Regístrate' : '¿Ya tienes cuenta? Inicia sesión' }}
			</button>
		</section>
	}
</main>
