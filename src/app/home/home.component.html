<section class="p-5">
  <div class="w-full md:w-9 mx-auto">
    <p class="text-color-secondary mt-0">Panel de control</p>
    <h1 class="text-4xl mt-0 mb-2">Organiza tu trabajo</h1>
    <p class="text-lg text-color-secondary mt-0">Un espacio sencillo para convertir tus pendientes en progreso.</p>
    <p-card>
      <ng-template #title>Tu espacio de trabajo</ng-template>
      <ng-template #subtitle>Gestiona tus tareas desde un solo lugar.</ng-template>
      <ng-template #footer>
        <a pButton [routerLink]="user() ? '/tasks' : '/register'">{{ user() ? 'Ver mis tareas' : 'Comenzar ahora' }}</a>
      </ng-template>
    </p-card>
  </div>
</section>
