<main class="auth-page">
  <section class="auth-panel">
    <a class="back-link" routerLink="/">← Nova CMS</a>
    <p class="eyebrow">Registro</p>
    <h1>Crea tu cuenta.</h1>
    <p class="subtitle">Empieza a organizar tu trabajo.</p>
    <form (ngSubmit)="submit()" #registerForm="ngForm">
      <label for="register-email">Correo electrónico</label>
      <input id="register-email" name="email" type="email" [(ngModel)]="email" required autocomplete="email">
      <label for="register-password">Contraseña</label>
      <input id="register-password" name="password" type="password" [(ngModel)]="password" required minlength="6" autocomplete="new-password">
      @if (error()) { <p class="error" role="alert">{{ error() }}</p> }
      <button class="button" type="submit" [disabled]="registerForm.invalid || loading()">{{ loading() ? 'Creando...' : 'Crear cuenta' }}</button>
    </form>
    <p class="auth-switch">¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
  </section>
</main>
