<main class="min-h-screen flex justify-content-center align-items-center p-4">
  <p-card class="w-full md:w-5">
    <ng-template #header><a pButton routerLink="/" [text]="true">← Nova CMS</a></ng-template>
    <ng-template #title>Crea tu cuenta.</ng-template>
    <ng-template #subtitle>Empieza a organizar tu trabajo.</ng-template>
    <form (ngSubmit)="submit()" #registerForm="ngForm">
      <label for="register-email">Correo electrónico</label>
      <input pInputText id="register-email" name="email" type="email" [(ngModel)]="email" required autocomplete="email">
      <label for="register-password">Contraseña</label>
      <p-password inputId="register-password" name="password" [(ngModel)]="password" [feedback]="false" [toggleMask]="true" required [minlength]="6" autocomplete="new-password"></p-password>
      @if (error()) { <p class="error" role="alert">{{ error() }}</p> }
      <button pButton class="button" type="submit" [disabled]="registerForm.invalid || loading()">{{ loading() ? 'Creando...' : 'Crear cuenta' }}</button>
    </form>
    <p class="text-center">¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
  </p-card>
</main>
