<main class="min-h-screen flex justify-content-center align-items-center p-4">
  <p-card class="w-full md:w-5">
    <ng-template #header><a pButton routerLink="/" [text]="true">← Nova CMS</a></ng-template>
    <ng-template #title>Entra a tu espacio.</ng-template>
    <ng-template #subtitle>Continúa con tu trabajo.</ng-template>
    <form (ngSubmit)="submit()" #loginForm="ngForm">
      <label for="login-email">Correo electrónico</label>
      <input pInputText id="login-email" name="email" type="email" [(ngModel)]="email" required autocomplete="email">
      <label for="login-password">Contraseña</label>
      <p-password inputId="login-password" name="password" [(ngModel)]="password" [feedback]="false" [toggleMask]="true" required autocomplete="current-password"></p-password>
      @if (error()) { <p class="error" role="alert">{{ error() }}</p> }
      <button pButton class="button" type="submit" [disabled]="loginForm.invalid || loading()">{{ loading() ? 'Entrando...' : 'Iniciar sesión' }}</button>
    </form>
    <p class="text-center">¿No tienes cuenta? <a routerLink="/register">Regístrate</a></p>
  </p-card>
</main>
