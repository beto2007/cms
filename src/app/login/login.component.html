<main class="auth-page">
  <section class="auth-panel">
    <a class="back-link" routerLink="/">← Nova CMS</a>
    <p class="eyebrow">Acceso</p>
    <h1>Entra a tu espacio.</h1>
    <p class="subtitle">Continúa con tu trabajo.</p>
    <form (ngSubmit)="submit()" #loginForm="ngForm">
      <label for="login-email">Correo electrónico</label>
      <input id="login-email" name="email" type="email" [(ngModel)]="email" required autocomplete="email">
      <label for="login-password">Contraseña</label>
      <input id="login-password" name="password" type="password" [(ngModel)]="password" required autocomplete="current-password">
      @if (error()) { <p class="error" role="alert">{{ error() }}</p> }
      <button class="button" type="submit" [disabled]="loginForm.invalid || loading()">{{ loading() ? 'Entrando...' : 'Iniciar sesión' }}</button>
    </form>
    <p class="auth-switch">¿No tienes cuenta? <a routerLink="/register">Regístrate</a></p>
  </section>
</main>
