<!-- Sidebar Header / Logo -->
<div class="flex align-items-center gap-3 px-4 py-4 border-bottom-1 border-200">
  <p-avatar
    icon="pi pi-bolt"
    shape="circle"
    size="large"
    [style]="{ 'background-color': 'var(--p-primary-color)', color: '#ffffff' }"
  />
  <div class="flex flex-column">
    <span class="font-bold text-lg line-height-2">Nova CMS</span>
    @if (user()) {
      <div class="flex align-items-center gap-2 mt-1">
        <span class="text-xs text-color-secondary">Rol:</span>
        <p-tag [value]="currentRole() | uppercase" [severity]="getRoleSeverity(currentRole())" styleClass="text-xs font-semibold" />
      </div>
    } @else {
      <span class="text-xs text-color-secondary">Panel de control</span>
    }
  </div>
</div>

<!-- Navigation -->
<nav class="flex flex-column gap-1 px-3 pt-4 flex-1">

  <!-- Label sección -->
  <span class="text-xs font-semibold text-color-secondary uppercase px-3 mb-1 letter-spacing-1">
    Navegación
  </span>

  <!-- Home -->
  <a
    routerLink="/"
    routerLinkActive="surface-200 font-semibold text-primary"
    [routerLinkActiveOptions]="{ exact: true }"
    pRipple
    class="flex align-items-center gap-3 px-3 py-3 border-round-lg text-color no-underline transition-colors transition-duration-150 hover:surface-100 cursor-pointer"
  >
    <i class="pi pi-home text-lg"></i>
    <span>Home</span>
  </a>

  <!-- Tareas — solo si está autenticado y tiene acceso a la ruta -->
  @if (user()) {
    @if (hasRouteAccess('/tasks')) {
      <a
        routerLink="/tasks"
        routerLinkActive="surface-200 font-semibold text-primary"
        pRipple
        class="flex align-items-center gap-3 px-3 py-3 border-round-lg text-color no-underline transition-colors transition-duration-150 hover:surface-100 cursor-pointer"
      >
        <i class="pi pi-check-square text-lg"></i>
        <span class="flex-1">Tareas</span>
      </a>
    } @else {
      <div class="flex align-items-center gap-3 px-3 py-3 border-round-lg text-color-secondary cursor-not-allowed opacity-50">
        <i class="pi pi-check-square text-lg"></i>
        <span class="flex-1">Tareas</span>
        <p-tag value="Sin Acceso" severity="danger" styleClass="text-xs" />
      </div>
    }

    <!-- Gestión de Roles (RBAC) -->
    @if (hasRouteAccess('/roles')) {
      <a
        routerLink="/roles"
        routerLinkActive="surface-200 font-semibold text-primary"
        pRipple
        class="flex align-items-center gap-3 px-3 py-3 border-round-lg text-color no-underline transition-colors transition-duration-150 hover:surface-100 cursor-pointer"
      >
        <i class="pi pi-shield text-lg"></i>
        <span class="flex-1">Roles & Permisos</span>
      </a>
    }
  } @else {
    <!-- Tareas bloqueada para invitados -->
    <div
      class="flex align-items-center gap-3 px-3 py-3 border-round-lg text-color-secondary cursor-not-allowed opacity-50"
    >
      <i class="pi pi-check-square text-lg"></i>
      <span class="flex-1">Tareas</span>
      <p-tag value="Login" severity="secondary" styleClass="text-xs" />
    </div>
  }

  <!-- Demo -->
  <a
    routerLink="/demo"
    routerLinkActive="surface-200 font-semibold text-primary"
    pRipple
    class="flex align-items-center gap-3 px-3 py-3 border-round-lg text-color no-underline transition-colors transition-duration-150 hover:surface-100 cursor-pointer"
  >
    <i class="pi pi-palette text-lg"></i>
    <span>Demo UI</span>
  </a>

</nav>
