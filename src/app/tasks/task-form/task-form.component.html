<p-card styleClass="shadow-2 border-round-xl">
  <ng-template #title>
    <span class="text-xl font-bold text-color">Nueva tarea</span>
  </ng-template>
  <ng-template #subtitle>
    <span class="text-xs text-color-secondary">Añadir trabajo al panel</span>
  </ng-template>

  <form [formGroup]="taskForm" (ngSubmit)="submit()" class="flex flex-column gap-3 mt-3">
    <!-- Título -->
    <div class="flex flex-column gap-2">
      <label for="task-title" class="font-semibold text-sm">Título</label>
      <input pInputText id="task-title" formControlName="title" type="text" placeholder="Ej. Revisar propuesta" class="w-full">
      @if (taskForm.get('title')?.touched && taskForm.get('title')?.errors?.['required']) {
        <small class="text-red-500 text-xs font-semibold">El título es requerido.</small>
      }
    </div>

    <!-- Descripción -->
    <div class="flex flex-column gap-2">
      <label for="task-description" class="font-semibold text-sm">Descripción <span class="text-color-secondary font-normal">(opcional)</span></label>
      <textarea pTextarea id="task-description" formControlName="description" rows="4" placeholder="Añade algunos detalles" class="w-full" [autoResize]="true"></textarea>
    </div>

    @if (error()) {
      <div class="p-3 border-round bg-red-50 border-1 border-red-200 flex align-items-center gap-2" role="alert">
        <i class="pi pi-exclamation-circle text-red-500"></i>
        <span class="text-sm text-red-600 font-medium">{{ error() }}</span>
      </div>
    }

    <p-button label="Crear tarea" type="submit" [disabled]="taskForm.invalid || saving()" [loading]="saving()" icon="pi pi-plus" styleClass="w-full mt-2" />
  </form>
</p-card>
