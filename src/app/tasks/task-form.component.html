<p-card>
  <ng-template #title>Nueva tarea</ng-template>
  <ng-template #subtitle>Añadir trabajo al panel</ng-template>
  <form class="p-fluid" [formGroup]="taskForm" (ngSubmit)="submit()">
    <label for="task-title">Título</label>
    <input pInputText id="task-title" formControlName="title" type="text" placeholder="Ej. Revisar propuesta">
    <label for="task-description">Descripción <span>(opcional)</span></label>
    <textarea pTextarea id="task-description" formControlName="description" rows="4" placeholder="Añade algunos detalles"></textarea>
    @if (error()) { <p class="error" role="alert">{{ error() }}</p> }
    <button pButton class="button" type="submit" [disabled]="taskForm.invalid || saving()">{{ saving() ? 'Guardando...' : 'Crear tarea' }}</button>
  </form>
</p-card>
